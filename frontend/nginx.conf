server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # KZ: landing pública en la raíz (HTML original)
    location = / {
        try_files /korzadi-landing.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # KZ: rutas públicas de la app -> HTML original
    location = /dashboard {
        try_files /Korzadi.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /assets {
        try_files /Korzadi.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /transactions {
        try_files /Korzadi.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /profile {
        try_files /Korzadi.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /security {
        try_files /Korzadi.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /p2p {
        try_files /Korzadi.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /p2p/ {
        try_files /Korzadi.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # KZ: retirar el service worker del SPA anterior
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 'self.registration.unregister();';
    }

    location /wallet {
        allow all;
        try_files $uri /WalletApp.html =404;
    }

    location ~ \.html$ {
        allow all;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # F5 FIX: proteger archivos sensibles de ser servidos accidentalmente
    location ~ /\.(env|env\.example|git|gitignore|docker-compose\.yml|docker-compose\.test\.yml) {
        deny all;
        return 404;
    }

    location ~ /\.(env|env\.example|git|gitignore)\.local$ {
        deny all;
        return 404;
    }
}
